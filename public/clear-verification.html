<!DOCTYPE html>
<html>
<head>
    <title>Clear NM Technology Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .card {
            background-color: #2d3748;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }
        .card.fade-out {
            transform: scale(0.95);
            opacity: 0;
        }
        h1 {
            color: #10b981;
            margin-top: 0;
        }
        button {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #374151;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background-color: #374151;
        }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a202c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 1000;
        }
        .loading-screen.visible {
            opacity: 1;
            pointer-events: all;
        }
        .progress-bar {
            width: 300px;
            height: 4px;
            background-color: #374151;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            margin-top: 20px;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: #10b981;
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loading-screen.visible .progress-bar::after {
            width: 100%;
        }
        .loading-text {
            color: #10b981;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease-out;
        }
        .loading-screen.visible .loading-text {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>NM Technology Verification Reset</h1>
        <p>This tool will clear your verification status, allowing you to test the math verification page again.</p>
        
        <button id="clearBtn">Clear Verification Status</button>
        
        <div class="status" id="status">
            Current status: <span id="verificationStatus">Checking...</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkStatus();
            
            document.getElementById('clearBtn').addEventListener('click', function() {
                // Clear the verification data
                localStorage.removeItem('humanVerified');
                localStorage.removeItem('humanVerifiedTimestamp');
                
                // Update status
                checkStatus();
                
                // Show confirmation
                alert('Verification status cleared! You can now reload the main site to see the verification page.');
            });
        });
        
        function checkStatus() {
            const statusEl = document.getElementById('verificationStatus');
            const verified = localStorage.getItem('humanVerified');
            const timestamp = localStorage.getItem('humanVerifiedTimestamp');
            
            if (verified && timestamp) {
                const date = new Date(parseInt(timestamp));
                statusEl.textContent = `Verified (${date.toLocaleString()})`;
                statusEl.style.color = '#10b981';
            } else {
                statusEl.textContent = 'Not verified';
                statusEl.style.color = '#f87171';
            }
        }
    </script>
</body>
</html>
